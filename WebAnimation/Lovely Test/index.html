<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Test</title>
</head>

<style>
    body {
        background-color: rgb(28, 28, 28);
    }

    .screen {
        transition: opacity 1s ease-in-out;
        width: 100%;
        position: absolute;
    }

    #sewerPartFade {
        z-index: 2;
        animation: fadeOutSewer 1s forwards;
    }

    #basementPart {
        z-index: 1;
        opacity: 0;
        animation: fadeInBasement 1.5s forwards;
    }

    @keyframes fadeOutSewer {
        to {opacity: 0;
            visibility: hidden;}
    }

    @keyframes fadeInBasement {
        to {opacity: 1;}
    }

    .sewer {
        width: 300px;
        height: 200px;
        display: block;
        background-image: url('https://p.turbosquid.com/ts-thumb/0y/zKaHEU/UY/render3/png/1752859661/1920x1080/fit_q87/ae2920f1ce09fe5baf250f5dd43466f1e8dcf017/render3.jpg');
        background-size: cover;
        background-position: center;
        margin-top: 300px;
        margin-left: auto;
        margin-right: auto;
    }

    .sewer:hover {
        filter: saturate(0%);
        filter: brightness(70%);
        background-image: url('https://pngimg.com/uploads/bullet_hole/bullet_hole_PNG6051.png');

    }


    .ScaptionContainer {
        position: relative;
        margin-top: 10px;
        height: 40px;
    }

    .firstCaptions {
        color: white;
        font-style: italic;
        text-align: center;
        position: absolute;
        left: 0;
        right: 0;
        margin: 0 auto;
        opacity: 0;
        animation: ScaptionTransition 3s forwards linear;
    }

    .firstCaptions:nth-child(1) { animation-delay: 0s; }
    .firstCaptions:nth-child(2) { animation-delay: 3s; }
    .firstCaptions:nth-child(3) { animation-delay: 6s; }
    .firstCaptions:nth-child(4) { animation-delay: 9s; }
    .firstCaptions:nth-child(5) { animation-delay: 12s; }

    @keyframes ScaptionTransition {
        0% { opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { opacity: 0; } 
    }

    .basementContainer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-image: linear-gradient( rgba(0,0,0,0.6),rgba(0,0,0,0.6)), url(https://wallpaperaccess.com/full/3821861.jpg);
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
    }

    .monsterContainer {
        position: relative;
        width: 400px;
        height: 500px;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        margin-left: auto;
        margin-right: auto;
    }
    
    .monsterSit {
        width: 200px;
        height: 200px;
        filter: saturate(60%) brightness(5%);
        display: block;
        opacity: 1;
        visibility: visible;
    } .monsterSitInactive {
        width: 200px;
        height: 200px;
        filter: saturate(60%) brightness(5%);
        display: block;
        opacity: 0;
        visibility: visible;
    }

    .monsterStand {
        width: 350px;
        height: 450px;
        filter: brightness(10%);
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        opacity: 1;
        visibility: visible;
        animation: monStand 2s forwards;

    }   .monsterStandInactive {
        position: absolute;
        bottom: 0;
        left: 50%;
        visibility: hidden;
    }

    @keyframes monStand {
        0% {opacity: 0; visibility: visible;}
        99% {opacity: 1; visibility: visible;}
    }

    @keyframes hideJumpscare {
        to {opacity: 0;
            visibility: hidden; 
            height: 0;
            width: 0;
        }
    }

    .monsterScare {
        width: 350px;
        height: 450px;
        filter: brightness(30%);
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        visibility: hidden;
        animation: zoomIn 0.15s forwards;
    }   .monsterScareInactive {
        visibility: hidden;

    }

    @keyframes zoomIn {
        0% {
            opacity: 0;
            visibility: visible;
            transform: translateX(-50%) scale3d(.3,.3,.3);
        }
        30% {
            opacity: 1;
        }
        100% {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale3d(2,2,2);
        }
    }

    .BcaptionContainer {
        position: relative;
        height: 60px;
        width: 100%;
    }

    .basementCaption{
        color: white;
        font-style: italic;
        text-align: center;
        position: absolute;
        left: 0;
        right: 0;
        margin: 0 auto;
        opacity: 0;
        animation: ScaptionTransition 3s forwards linear;
    }  .basementCaptionInactive{
        color: white;
        font-style: italic;
        text-align: center;
        position: absolute;
        left: 0;
        right: 0;
        margin: 0 auto;
        opacity: 0;
    }

    .BcaptionContainer .basementCaption:nth-child(1) { animation-delay: 3s; }
    .BcaptionContainer .basementCaption:nth-child(2) { animation-delay: 6s; }
    .BcaptionContainer .basementCaption:nth-child(3) { animation-delay: 9s; }
    .BcaptionContainer .basementCaption:nth-child(4) { animation-delay: 12s; }
    .BcaptionContainer .basementCaption:nth-child(5) { animation-delay: 15s; }
    .BcaptionContainer .basementCaption:nth-child(6) { animation-delay: 18s; }
    .BcaptionContainer .basementCaption:nth-child(7) { animation-delay: 21s; }
    .BcaptionContainer .basementCaption:nth-child(8) { animation-delay: 24s; }

    .BcaptionContainer .basementCaption:nth-child(9) { animation-delay: 0s; }    
    .BcaptionContainer .basementCaption:nth-child(10) { animation-delay: 3s; }
    .BcaptionContainer .basementCaption:nth-child(11) { animation-delay: 6s; }


    .floor {
        position: absolute;
        bottom: 1.5%;
        left: 0;
        width: 100%;
        height: 100px;
    }

    .ratPhoto {
        width: 60px;
        height: auto;
        filter: brightness(15%);
        position: absolute;
        bottom: 0;
        animation: runAround 16s infinite ease-in-out;
    } 
    #basementPartInactive {
        visibility: hidden;
    } #basementPartInactive > div {
        visibility: hidden;
    } #basementPartInactive > img {
        visibility: hidden;
    } #basementPart > div {
        visibility: visible;
    }  #basementPart > img {
        visibility: visible;
    } #basementPart {
        visibility: visible;
    }

    @keyframes runAround {
        0%, 25% {
            left: calc(100% + 100px);
        }
        50% {
            left: -100px;
        }
        75% {
            left: -100px;
        }
        100% {
            left: calc(100% + 100px);
        }
    }

</style>

<body>
    <div id="sewerPart" class="screen">
    <div class="sewer" onclick="triggerSewer()"></div>
        <div class="ScaptionContainer">
            <p class="firstCaptions">Psst!</p>
            <p class="firstCaptions">Pssssst!</p>
            <p class="firstCaptions">Hey!</p>
            <p class="firstCaptions">Down here...</p>
            <p class="firstCaptions">Can I talk to you?</p>
        </div>
    </div>

    <div id="basementPartInactive" class="screen">
        <img src="https://file.aiquickdraw.com/imgcompressed/img/compressed_e6e1ffa8b9405c335ec48de248e1f03d.webp">

        <div class="basementContainer">
            <div class="floor">
            <img class="ratPhotoInactive" src="https://file.aiquickdraw.com/imgcompressed/img/compressed_e6e1ffa8b9405c335ec48de248e1f03d.webp">
            </div>
            <div class="monsterContainer">
                <img class="monsterSitInactive" src="https://i.redd.it/guys-can-scp-096-the-soy-guy-solos-the-entire-cookie-run-v0-dqffdoelzq0f1.png?width=360&format=png&auto=webp&s=d2ee9e0e7ea379a15022f08d98815cffc7597f64" onclick="triggerStand()">
                <img class="monsterStandInactive" src="https://hub.scpslgame.com/images/7/76/096rerender.png" onclick="triggerJump()">
                <img class="monsterScareInactive" src="https://static.wikia.nocookie.net/ntf/images/3/39/SCP-096.png/revision/latest/thumbnail/width/360/height/450?cb=20240328225842">
            </div>
            <div class="BcaptionContainer">
            <!--yo who wrote this? there was like 15 kajillion contraction errors-->
                <p class="basementCaptionInactive" id="toActive">It's cold down here, isnt it?</p>
                <p class="basementCaptionInactive" id="toActive">Why did you come down here?</p>
                <p class="basementCaptionInactive" id="toActive" style="color: rgb(248, 220, 59);">I thought you needed help..?</p>
                <p class="basementCaptionInactive" id="toActive">No...</p>
                <p class="basementCaptionInactive" id="toActive" style="color: rgb(248, 220, 59);">What? Where are you?</p>
                <p class="basementCaptionInactive" id="toActive" style="color: rgb(248, 220, 59);">I can't see you.</p>
                <p class="basementCaptionInactive" id="toActive">Do you...want to see me?</p>
                <p class="basementCaptionInactive" id="toActive" style="color: rgb(248, 220, 59);">I'm here to help.</p>
                <p class="basementCaptionInactive" id="toActive">I don't need help...but</p>
                <p class="basementCaptionInactive" id="toActive">I am...starving...</p>
                <p class="basementCaptionInactive" id="toActive" style="color: rgb(248, 220, 59);">What...are you?</p>
            </div>
        </div>
    </div>

</body>

<script>
    function triggerStand() {
        document.getElementsByClassName("monsterSit")[0].classList.replace("monsterSit", "monsterSitInactive");
        document.getElementsByClassName("monsterStandInactive")[0].classList.replace("monsterStandInactive", "monsterStand");
        //advancing through the rest of the text
        for(var i = 0; i < 3; i++) {
            document.getElementsByClassName("basementCaptionInactive")[0].classList.replace("basementCaptionInactive", "basementCaption");
        } 
    } function triggerJump() {
        document.getElementsByClassName("monsterStand")[0].classList.replace("monsterStand", "monsterStandInactive");
        document.getElementsByClassName("monsterScareInactive")[0].classList.replace("monsterScareInactive", "monsterScare");
    } function triggerSewer() {
        document.getElementById("sewerPart").setAttribute("id", "sewerPartFade");
        document.getElementById("basementPartInactive").setAttribute("id", "basementPart");
        document.getElementsByClassName("monsterSitInactive")[0].classList.replace("monsterSitInactive", "monsterSit");
        //advancing the text up to 8 lines
        for(var i = 0; i < 8; i++) {
            document.getElementsByClassName("basementCaptionInactive")[0].classList.replace("basementCaptionInactive", "basementCaption");
        }
    }
</script>

</html>
