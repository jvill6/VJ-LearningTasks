<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animations Test</title>
  <style>
        body {
            background-color:rgb(66, 6, 21);
        } @keyframes XRank {
            from {
                transform: scale(4);
            } 50% {
                transform: scale(1);
            }
        } .X { 
            animation-name: XRank;
            animation-duration: 1.4s;
            animation-iteration-count: 3;
            animation-timing-function: ease-in-out;
        } @keyframes SRank {
             50% {
                transform: rotate(360deg);
            }
        } .S { 
            animation-name: SRank;
            animation-duration: 1.4s;
            animation-delay: 6s;
            animation-iteration-count: 3;
            animation-timing-function: ease-in-out;
        } @keyframes ARank {
            from {
                transform: translate(1000px);
            } 50% {
                transform: translate(0px);
            }
        } .A { 
            animation-name: ARank;
            animation-duration: 1.4s;
            animation-delay: 12s;
            animation-iteration-count: 3;
            animation-timing-function: ease-in-out;
        }

  </style>
</head>

<body>
    <img src="./Images/X.png" class="X">
    <br>
    <img src="./Images/S.png" class="S">
    <br>
    <img src="./Images/A.png" class="A">

    
</body>
